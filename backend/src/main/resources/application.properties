spring.application.name=careerpilot-backend
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/careerpilot_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:careerpilot-ai-super-secret-key-2025-production-ready-256bit-minimum}
jwt.expiration=86400000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads

# AI APIs
openai.api.key=${OPENAI_API_KEY:}
gemini.api.key=${GEMINI_API_KEY:}

# CORS
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173}

# Logging
logging.level.com.careerpilot=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
